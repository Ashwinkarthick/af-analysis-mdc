[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "af-analysis"
version = "1.0.0"
description = "Streamlit browser for AlphaFold and AlphaPulldown interaction analysis"
authors = ["Ashwin Karthick Natarajan <ashwin.natarajan@mdc-berlin.de>"]
license = "GPL-2.0-only"
readme = "README.md"
packages = [{include = "af_analysis", from = "src"}]
include = [
    "LICENSE",
    "README.md",
]

[tool.poetry.scripts]
af-analysis = "af_analysis.cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
streamlit = ">=1.51.0"
pandas = ">=2.2.2"
matplotlib = ">=3.10.5"
numpy = ">=1.26.4"
plotly = ">=5.22.0"
alphajudge = ">=1.0"
